name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.1
        run: |
          echo "y" | sdkmanager "ndk;27.1.12297006"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate keystore (for signing)
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Running Tracker, OU=Personal, O=Personal, L=City, S=State, C=IN"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../android/app/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon
        env:
          NODE_ENV: production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: running-tracker-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          echo "✅ APK built successfully! Download from the Actions tab above."
